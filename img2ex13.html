<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>img2ex13</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            width: 150px;
            height: 140px;

            display: grid;
            gap: 4px;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);

            grid-template-areas:
                "a b c"
                "a d e"
                "f f e"
                "g h i";
        }

        div {
            background: #333;
            border-radius: 3px;
        }

        .a { grid-area: a; }
        .b { grid-area: b; }
        .c { grid-area: c; }
        .d { grid-area: d; }
        .e { grid-area: e; }
        .f { grid-area: f; }
        .g { grid-area: g; }
        .h { grid-area: h; }
        .i { grid-area: i; }
    </style>
</head>

<body>

<div class="grid">
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
    <div class="e"></div>
    <div class="f"></div>
    <div class="g"></div>
    <div class="h"></div>
    <div class="i"></div>
</div>

</body>
</html>
